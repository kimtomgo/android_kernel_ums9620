name: P720S11 kernel build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_bsp_modules:
        description: "Optional space-separated KO_MODULE_NAME values to build"
        required: false
        type: string
        default: ""
      package_device_images:
        description: "Also rebuild boot_stock.img and vendor_dlkm_stock.img (requires device dump secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p720s11-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build UMS9620 / P720S11
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OUT: out_stock_lto2
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_REVISION: 21b19c041de1f1df9b97fd9902ae5405c6cf8eb9
      CLANG_DIR: ${{ runner.temp }}/clang-r563880c

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install kernel and image build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl dwarves flex git libelf-dev \
            libncurses-dev libssl-dev lz4 lzop python3 python3-lz4 \
            rsync unzip wget zip zstd \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          sudo apt-get clean

      - name: Restore Android Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r563880c
          key: android-clang-r563880c-${{ env.CLANG_REVISION }}-linux-x86_64

      - name: Download pinned Android Clang r563880c
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CLANG_DIR"
          archive="$RUNNER_TEMP/clang-r563880c.tar.gz"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$CLANG_REVISION/clang-r563880c.tar.gz"
          curl -fL --retry 3 --retry-delay 2 "$url" -o "$archive"
          tar -xzf "$archive" -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          rm -f "$archive"

      - name: Verify toolchain and source configuration
        env:
          CLANG_BIN: ${{ runner.temp }}/clang-r563880c/bin
        run: |
          set -euo pipefail
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          export PATH="$CLANG_BIN:$PATH"
          clang --version | tee "$RUNNER_TEMP/clang-version.txt"
          grep -F "5e96669f06077099aa41290cdb4c5e6fa0f59349" "$RUNNER_TEMP/clang-version.txt"
          ld.lld --version
          llvm-ar --version
          test -f stock_p720s11.config
          test -f arch/arm64/configs/sprd_p720s11_defconfig
          test -d KernelSU
          git submodule status --recursive

      - name: Validate build scripts
        run: |
          set -euo pipefail
          bash -n build_stock_lto.sh
          bash -n build_bsp_modules.sh
          bash -n package_stock_lto.sh
          git diff --check

      - name: Build kernel Image and in-tree modules
        env:
          CLANG_BIN: ${{ runner.temp }}/clang-r563880c/bin
        run: |
          set -euo pipefail
          OUT="$OUT" CLANG_BIN="$CLANG_BIN" CROSS_COMPILE="$CROSS_COMPILE" ./build_stock_lto.sh

      - name: Build selected UNISOC BSP modules
        if: ${{ inputs.build_bsp_modules != '' }}
        env:
          CLANG_BIN: ${{ runner.temp }}/clang-r563880c/bin
          BSP_MODULES: ${{ inputs.build_bsp_modules }}
        run: |
          set -euo pipefail
          read -r -a modules <<< "$BSP_MODULES"
          test "${#modules[@]}" -gt 0
          OUT="$OUT" CLANG_BIN="$CLANG_BIN" CROSS_COMPILE="$CROSS_COMPILE" ./build_bsp_modules.sh "${modules[@]}"

      - name: Collect kernel artifacts
        env:
          CLANG_BIN: ${{ runner.temp }}/clang-r563880c/bin
        run: |
          set -euo pipefail
          export PATH="$CLANG_BIN:$PATH"
          mkdir -p artifacts/modules artifacts/metadata
          install -m 0644 "$OUT/arch/arm64/boot/Image" artifacts/Image
          cp "$OUT/.config" artifacts/metadata/kernel.config
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" kernelrelease \
            | tee artifacts/metadata/kernelrelease.txt
          clang --version > artifacts/metadata/clang-version.txt
          git rev-parse HEAD > artifacts/metadata/source-commit.txt
          git submodule status --recursive > artifacts/metadata/submodules.txt
          find "$OUT" -type f -name '*.ko' -print0 \
            | while IFS= read -r -d '' ko; do
                rel="${ko#"$OUT"/}"
                mkdir -p "artifacts/modules/$(dirname "$rel")"
                cp -f "$ko" "artifacts/modules/$rel"
              done
          (cd artifacts && find . -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS)
          test -s artifacts/Image

      - name: Prepare AOSP boot image tools
        if: ${{ inputs.package_device_images }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/mkbootimg-src"
          git -C "$RUNNER_TEMP/mkbootimg-src" checkout 34ac1ae663fc8f553b2a96ee08b66c97ab2290c8
          mkdir -p "$RUNNER_TEMP/android-host-tools"
          install -m 0755 "$RUNNER_TEMP/mkbootimg-src/mkbootimg.py" "$RUNNER_TEMP/android-host-tools/mkbootimg"
          install -m 0755 "$RUNNER_TEMP/mkbootimg-src/unpack_bootimg.py" "$RUNNER_TEMP/android-host-tools/unpack_bootimg"
          echo "$RUNNER_TEMP/android-host-tools" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$RUNNER_TEMP/mkbootimg-src:${PYTHONPATH:-}" >> "$GITHUB_ENV"
          export PYTHONPATH="$RUNNER_TEMP/mkbootimg-src:${PYTHONPATH:-}"
          export PATH="$RUNNER_TEMP/android-host-tools:$PATH"
          mkbootimg --help >/dev/null
          unpack_bootimg --help >/dev/null
          mkfs.erofs --help >/dev/null
          fsck.erofs --help >/dev/null

      - name: Download and verify private device dump
        if: ${{ inputs.package_device_images }}
        env:
          DEVICE_DUMP_URL: ${{ secrets.DEVICE_DUMP_URL }}
          DEVICE_DUMP_SHA256: ${{ secrets.DEVICE_DUMP_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$DEVICE_DUMP_URL" ]] || { echo "Missing repository secret DEVICE_DUMP_URL" >&2; exit 2; }
          [[ "$DEVICE_DUMP_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "Missing/invalid DEVICE_DUMP_SHA256 (64 hex characters)" >&2; exit 2; }
          archive="$RUNNER_TEMP/p720s11-device-dump.tar.gz"
          curl -fL --retry 3 --retry-delay 2 "$DEVICE_DUMP_URL" -o "$archive"
          echo "$DEVICE_DUMP_SHA256  $archive" | sha256sum -c -
          mkdir -p device-inputs
          tar -tzf "$archive" > "$RUNNER_TEMP/device-dump-files.txt"
          grep -Fxq "device_dump/boot_a.img" "$RUNNER_TEMP/device-dump-files.txt"
          grep -Fxq "device_dump/vendor_boot.img" "$RUNNER_TEMP/device-dump-files.txt"
          grep -Fxq "device_dump/vendor_dlkm.img" "$RUNNER_TEMP/device-dump-files.txt"
          grep -Eq '^vendor_dlkm_extract/lib/modules/[^/]+\.ko
          test -s device-inputs/device_dump/boot_a.img
          test -s device-inputs/device_dump/vendor_boot.img
          test -s device-inputs/device_dump/vendor_dlkm.img
          test -d device-inputs/vendor_dlkm_extract/lib/modules

      - name: Rebuild stock-derived boot and vendor_dlkm images
        if: ${{ inputs.package_device_images }}
        env:
          HOST_TOOLS_BIN: ${{ runner.temp }}/android-host-tools
          DUMP: device-inputs/device_dump
          IMGDIR: device-inputs
          BOOT_PARTITION_SIZE: "67108864"
        run: |
          set -euo pipefail
          OUT="$OUT" DUMP="$DUMP" IMGDIR="$IMGDIR" \
            HOST_TOOLS_BIN="$HOST_TOOLS_BIN" BOOT_PARTITION_SIZE="$BOOT_PARTITION_SIZE" \
            ./package_stock_lto.sh
          mkdir -p artifacts/images
          install -m 0644 "$IMGDIR/boot_stock.img" artifacts/images/
          install -m 0644 "$IMGDIR/vendor_dlkm_stock.img" artifacts/images/
          (cd artifacts/images && sha256sum *.img > SHA256SUMS)

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: p720s11-kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
 "$RUNNER_TEMP/device-dump-files.txt"
          tar -xzf "$archive" -C device-inputs
          test -s device-inputs/device_dump/boot_a.img
          test -s device-inputs/device_dump/vendor_boot.img
          test -s device-inputs/device_dump/vendor_dlkm.img
          test -d device-inputs/vendor_dlkm_extract/lib/modules

      - name: Rebuild stock-derived boot and vendor_dlkm images
        if: ${{ inputs.package_device_images }}
        env:
          HOST_TOOLS_BIN: ${{ runner.temp }}/android-host-tools
          DUMP: device-inputs/device_dump
          IMGDIR: device-inputs
          BOOT_PARTITION_SIZE: "67108864"
        run: |
          set -euo pipefail
          OUT="$OUT" DUMP="$DUMP" IMGDIR="$IMGDIR" \
            HOST_TOOLS_BIN="$HOST_TOOLS_BIN" BOOT_PARTITION_SIZE="$BOOT_PARTITION_SIZE" \
            ./package_stock_lto.sh
          mkdir -p artifacts/images
          install -m 0644 "$IMGDIR/boot_stock.img" artifacts/images/
          install -m 0644 "$IMGDIR/vendor_dlkm_stock.img" artifacts/images/
          (cd artifacts/images && sha256sum *.img > SHA256SUMS)

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: p720s11-kernel-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
